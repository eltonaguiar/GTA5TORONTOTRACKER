name: Console Stock Monitor

on:
  schedule:
    # Every 30 minutes (GitHub may delay during peak times)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet curl_cffi

      - name: Scrape Canada Computers + rebuild README
        run: python scripts/check_stock.py

      - name: Commit & push if README changed
        run: |
          git config user.name  "stock-monitor[bot]"
          git config user.email "stock-monitor@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "chore: auto-update console stock ($(date -u +%FT%TZ))"
            git push
          else
            echo "No README change"
          fi
